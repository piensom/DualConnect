server {
    listen 80;
    server_name localhost;

    # Root directory
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main location - serve from pages directory
    location / {
        try_files /pages$uri /pages$uri.html /pages/index.html =404;
    }

    # Serve static files (CSS, JS, images)
    location /styles/ {
        alias /usr/share/nginx/html/styles/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /scripts/ {
        alias /usr/share/nginx/html/scripts/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Serve JSON data files
    location /database/ {
        alias /usr/share/nginx/html/database/;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
    }

    # Custom error pages
    error_page 404 /pages/index.html;
    error_page 500 502 503 504 /pages/index.html;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
